<header class="app-header">
  <div class="brand">
    <a routerLink="/standings">PoolChapy</a>
  </div>

  <nav class="app-nav">
    <a routerLink="/standings" routerLinkActive="active">Classement</a>
    <a routerLink="/stats" routerLinkActive="active">Stats</a>
    <a
      *ngIf="authService.isAdmin()"
      routerLink="/admin/playoffs-rosters"
      routerLinkActive="active"
    >
      Admin séries
    </a>
  </nav>

  <div class="header-user-shell">
    <div class="user-menu" *ngIf="authService.currentUser() as user; else loginButton">
      <button type="button" class="user-menu-trigger" (click)="toggleUserMenu($event)">
        <span class="user-menu-name">{{ user.displayName }}</span>
        <span class="user-menu-chevron" [class.open]="userMenuOpen">▾</span>
      </button>

      <div class="user-menu-dropdown" *ngIf="userMenuOpen" (click)="$event.stopPropagation()">
        <a
          routerLink="/preferences"
          class="user-menu-item"
          (click)="closeUserMenu()"
        >
          Préférences
        </a>

        <div class="user-menu-divider"></div>

        <div class="user-menu-section-label">Switch user dev</div>

        <button
          type="button"
          class="user-menu-item user-menu-item--button"
          *ngFor="let devUser of devUsers()"
          (click)="onSwitchDevUser(devUser.username)"
        >
          {{ devUser.displayName }}
        </button>

        <div class="user-menu-divider"></div>

        <button
          type="button"
          class="user-menu-item user-menu-item--button danger"
          (click)="onLogout()"
        >
          Déconnexion
        </button>

        <div class="user-menu-divider"></div>

        <button
          type="button"
          class="user-menu-item user-menu-item--button danger"
          (click)="onResetDevUser()"
        >
          Reset dev user
        </button>
      </div>
    </div>

    <ng-template #loginButton>
      <a
        routerLink="/login"
        class="login-header-button"
      >
        Se connecter
      </a>
    </ng-template>
  </div>
</header>

<router-outlet></router-outlet>
